<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farad 입문 영상 슬라이드</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #e9e9e6; }
    main { width: min(100%, 1920px); margin: 0 auto; padding: 24px; }
    img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 0 24px;
      background: #f7f7f5;
      box-shadow: 0 1px 8px rgba(0, 0, 0, 0.12);
    }
    @media (max-width: 720px) {
      main { padding: 8px; }
      img { margin-bottom: 8px; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main>
    <img src="images/slide-01.png" alt="Farad 입문 슬라이드 1">
    <img src="images/slide-02.png" alt="Farad 입문 슬라이드 2" loading="lazy">
    <img src="images/slide-03.png" alt="Farad 입문 슬라이드 3" loading="lazy">
    <img src="images/slide-04.png" alt="Farad 입문 슬라이드 4" loading="lazy">
    <img src="images/slide-05.png" alt="Farad 입문 슬라이드 5" loading="lazy">
    <img src="images/slide-06.png" alt="Farad 입문 슬라이드 6" loading="lazy">
    <img src="images/slide-07.png" alt="Farad 입문 슬라이드 7" loading="lazy">
  </main>
</body>
</html>
